name: Kalimba-MC CI & GitHub Pages Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Pages 배포 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Lint & Compile Check
        run: npm run lint

      - name: Run Sound Quality & Multi-Touch Tests
        run: |
          npx tsx scripts/soundQualityEngine.test.ts
          npx tsx scripts/multitouchController.test.ts
          npx tsx scripts/practiceReward.test.ts
          npx tsx scripts/measurePractice.test.ts
          npx tsx scripts/speechNarration.test.ts
          npx tsx scripts/learningFlow.test.ts

      - name: Build Production Web App
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
