<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e154f"/>
      <stop offset="50%" stop-color="#120c38"/>
      <stop offset="100%" stop-color="#08051e"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="tineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Stars & Sparkles -->
  <circle cx="90" cy="110" r="4" fill="#facc15" filter="url(#glow)"/>
  <circle cx="430" cy="90" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="420" cy="400" r="5" fill="#f472b6" filter="url(#glow)"/>
  <circle cx="80" cy="380" r="4" fill="#a78bfa" filter="url(#glow)"/>
  <path d="M 120 70 L 125 85 L 140 90 L 125 95 L 120 110 L 115 95 L 100 90 L 115 85 Z" fill="#fef08a" opacity="0.8"/>
  <path d="M 390 140 L 393 150 L 403 153 L 393 156 L 390 166 L 387 156 L 377 153 L 387 150 Z" fill="#67e8f9" opacity="0.9"/>

  <!-- Kalimba Body (Wood) -->
  <path d="M 110 160 L 402 160 C 418 280, 422 380, 392 430 C 372 455, 140 455, 120 430 C 90 380, 94 280, 110 160 Z" fill="url(#woodGrad)" stroke="#f59e0b" stroke-width="4"/>

  <!-- Soundhole with decorative ring -->
  <circle cx="256" cy="350" r="46" fill="#0f0b24" stroke="#d97706" stroke-width="4"/>
  <circle cx="256" cy="350" r="40" fill="#08051a"/>
  <!-- Musical note in soundhole -->
  <path d="M 252 334 L 268 330 L 268 354 A 8 8 0 1 1 254 360 L 254 334 Z" fill="#38bdf8" opacity="0.85"/>

  <!-- Metal Bridge Bar -->
  <rect x="130" y="180" width="252" height="18" rx="6" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
  <rect x="136" y="210" width="240" height="10" rx="4" fill="#475569"/>

  <!-- Kalimba Metal Tines (Inverted V Shape) -->
  <!-- Center Tine (C4, Key 8) - Longest -->
  <rect x="249" y="174" width="14" height="125" rx="7" fill="url(#tineGrad)" stroke="#334155" stroke-width="1.5"/>
  <circle cx="256" cy="285" r="3.5" fill="#ef4444"/>

  <!-- Left Side Tines -->
  <rect x="231" y="174" width="13" height="118" rx="6.5" fill="url(#tineGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="213" y="174" width="13" height="110" rx="6.5" fill="url(#tineGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="195" y="174" width="13" height="102" rx="6.5" fill="url(#tineGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="177" y="174" width="13" height="94" rx="6.5" fill="url(#tineGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="159" y="174" width="13" height="86" rx="6.5" fill="url(#tineGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="141" y="174" width="13" height="78" rx="6.5" fill="url(#tineGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Right Side Tines -->
  <rect x="268" y="174" width="13" height="118" rx="6.5" fill="url(#tineGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="286" y="174" width="13" height="110" rx="6.5" fill="url(#tineGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="304" y="174" width="13" height="102" rx="6.5" fill="url(#tineGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="322" y="174" width="13" height="94" rx="6.5" fill="url(#tineGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="340" y="174" width="13" height="86" rx="6.5" fill="url(#tineGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="358" y="174" width="13" height="78" rx="6.5" fill="url(#tineGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Center Tine Sparkle Wave -->
  <path d="M 240 295 Q 256 270 272 295" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.9" filter="url(#glow)"/>
</svg>
